<script>
const SUPABASE_URL='https://qaikzwqdjdxkhhzscish.supabase.co';const SUPABASE_KEY='sb_publishable_vYctD5nCWCFg5l02VHg8uA_OFOLOlYH';const vin=(new URLSearchParams(location.search).get('vin')||'').trim().toUpperCase();
